<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Funnel Audit | Kaldera Analytics</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      @font-face { font-family: 'Barlow'; font-weight: 400; font-display: swap; src: url('/fonts/barlow-latin-400-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Barlow'; font-weight: 500; font-display: swap; src: url('/fonts/barlow-latin-500-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Barlow Condensed'; font-weight: 600; font-display: swap; src: url('/fonts/barlow-condensed-latin-600-normal.woff2') format('woff2'); }
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; }
      body { background: #000; color: #fff; font-family: 'Barlow', system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr; }
      header { display: flex; align-items: baseline; gap: 0.6rem; padding: 0 clamp(1.25rem, 3.4vw, 3.25rem); height: 3.75rem; border-bottom: 1px solid rgba(255, 255, 255, 0.2); }
      .name { font-family: 'Barlow Condensed', 'Barlow', sans-serif; font-weight: 600; font-size: 1.45rem; letter-spacing: 0.12em; color: #fff; text-decoration: none; }
      .sub { font-size: 0.55rem; letter-spacing: 0.32em; text-transform: uppercase; color: #a7a7a7; }
      main { display: grid; align-content: center; padding: 2rem clamp(1.25rem, 3.4vw, 3.25rem); max-width: 44rem; }
      .eyebrow { font-size: 0.7rem; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: #a7a7a7; margin-bottom: 1.5rem; }
      .eyebrow span { color: #fff; margin-right: 0.6em; }
      h1 { font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; line-height: 1.1; font-size: clamp(1.5rem, 3.2vw, 2.6rem); }
      p { margin-top: 1.5rem; color: #a7a7a7; line-height: 1.6; max-width: 34rem; }
      a.btn { display: inline-block; justify-self: start; margin-top: 2rem; padding: 0.7rem 1.1rem; border: 1px solid #fff; color: #fff; text-decoration: none; font-size: 0.7rem; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; }
      a.btn:hover, a.btn:focus-visible { background: #fff; color: #000; }
    </style>
  </head>
  <body>
    <header>
      <a class="name" href="/">KALDERA</a>
      <span class="sub">Analytics</span>
    </header>
    <main>
      <p class="eyebrow"><span>[ 404 ]</span>Page not found</p>
      <h1>There is nothing at this address.</h1>
      <p>The page may have moved or the link may be out of date. The Funnel Audit overview is the place to start.</p>
      <a class="btn" href="/">Back to the Funnel Audit</a>
    </main>
  </body>
</html>
